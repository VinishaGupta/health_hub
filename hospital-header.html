<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital Header</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            background: #fff;
        }

        .hospital-logo {
            width: 95px;
            height: 95px;
            border: 4px solid #14a5d8;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: #0B4DA2;
            background: #fff;
            flex-shrink: 0;
        }

        #hospitalName {
            transition: opacity .35s ease;
        }

        @media (max-width:768px) {

            .header {
                padding: 16px;
            }

            .hospital-logo {
                width: 70px;
                height: 70px;
                font-size: 18px;
            }

            #hospitalName {
                font-size: 26px !important;
            }

            .location {
                font-size: 16px !important;
            }

        }
    </style>

</head>

<body>

    <section class=" border-b shadow-sm">

        <div class="max-w-7xl mx-auto px-8 py-2">

            <div class="header flex items-center gap-5">

                <!-- Logo -->
                <div class="hospital-logo">
                    Logo
                </div>

                <!-- Hospital Details -->
                <!-- Hospital Details -->
<div>

    <!-- Short Name -->
    <p class="text-sm font-semibold text-indigo-600 tracking-wide mb-[8px]">
        Short Name
    </p>

    <!-- Hospital Name -->
    <h1 id="hospitalName"
        class="text-[42px] font-extrabold text-[#0B4DA2] leading-tight h-[50px] overflow-hidden">

        City Care Hospital

    </h1>

    <!-- Location -->
    <p class="location text-xl font-semibold text-[#006878] mt-1">

        Location

    </p>

</div>

            </div>

        </div>

    </section>

    <script>

        const hospitalNames = [
            "City Care Hospital",
            "सिटी केयर हॉस्पिटल",
            "সিটি কেয়ার হাসপাতাল"
        ];

        let current = 0;

        setInterval(() => {

            const title = document.getElementById("hospitalName");

            title.style.opacity = "0";

            setTimeout(() => {

                current = (current + 1) % hospitalNames.length;

                title.textContent = hospitalNames[current];

                title.style.opacity = "1";

            }, 300);

        }, 2500);

    </script>

</body>

</html>
