<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Photo Bank</title>

    <script src="https://cdn.tailwindcss.com"></script>


    <style>

        /* =====================================================
           GLOBAL
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;

            overflow-x: hidden;
        }


        body {
            background: #f8f9ff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }



        /* =====================================================
           HOSPITAL HEADER
           
           IMPORTANT:
           Back button is NOT inside this section.
        ===================================================== */

        .hospital-header {

            width: 100%;

            background: #ffffff;

            border-bottom:
                1px solid #e5e7eb;

            box-shadow:
                0 2px 6px rgba(0, 0, 0, 0.08);
        }


        .header-container {

            width: 100%;

            max-width: 1280px;

            margin: 0 auto;

            padding:
                32px 40px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 28px;
        }



        /* =====================================================
           LOGO
        ===================================================== */

        .hospital-logo {

            width: 112px;

            height: 112px;

            min-width: 112px;

            border-radius: 50%;

            border:
                4px solid #0ea5e9;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-shrink: 0;

            font-size: 20px;

            font-weight: 700;

            color: #0B4DA2;

            background: #ffffff;
        }



        /* =====================================================
           HOSPITAL INFORMATION
        ===================================================== */

        .hospital-details {

            min-width: 0;
        }


        .hospital-name {

            margin: 0;

            font-size: 36px;

            line-height: 1.2;

            font-weight: 700;

            color: #0B4DA2;

            overflow-wrap: anywhere;

            word-break: break-word;
        }


        .hospital-location {

            margin:
                8px 0 0;

            font-size: 20px;

            line-height: 1.4;

            font-weight: 700;

            color: #006878;

            overflow-wrap: anywhere;

            word-break: break-word;
        }



        /* =====================================================
           BACK NAVIGATION
           
           This is completely OUTSIDE the white header.
        ===================================================== */

        .back-section {

            width: 100%;

            max-width: 1280px;

            margin: 0 auto;

            padding:
                20px 32px 0;
        }


        .back-button {

            display: inline-flex;

            align-items: center;

            gap: 6px;

            color: #0B4DA2;

            text-decoration: none;

            font-size: 24px;

            font-weight: 700;

            line-height: 1;

            transition:
                color .3s ease,
                transform .3s ease;
        }


        .back-button:hover {

            color: #2563eb;

            transform:
                translateX(-2px);
        }


        .back-arrow {

            font-size: 32px;

            line-height: 1;
        }



        /* =====================================================
           PHOTO SECTION
        ===================================================== */

        .photo-section {

            width: 100%;

            max-width: 1280px;

            margin: 0 auto;

            padding:
                48px 32px 64px;
        }


        .photo-heading {

            margin:
                0 0 32px;

            font-size: 32px;

            line-height: 1.2;

            font-weight: 700;

            color: #0B4DA2;
        }



        /* =====================================================
           PHOTO GRID
        ===================================================== */

        .photo-grid {

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 48px;
        }


        .photo-card {

            width: 100%;

            min-width: 0;

            text-align: center;
        }


        .photo-card img {

            display: block;

            width: 100%;

            height: 260px;

            object-fit: cover;

            border-radius: 12px;

            cursor: pointer;

            box-shadow:
                0 5px 15px
                rgba(0, 0, 0, .12);

            transition:
                transform .3s ease;
        }


        .photo-card img:hover {

            transform:
                scale(1.04);
        }


        .photo-title {

            margin:
                20px 0 0;

            font-size: 20px;

            line-height: 1.4;

            font-weight: 600;

            color: #111827;

            overflow-wrap: anywhere;
        }



        /* =====================================================
           IMAGE POPUP
        ===================================================== */

        #imagePopup {

            position: fixed;

            inset: 0;

            width: 100%;

            height: 100%;

            background:
                rgba(0, 0, 0, .88);

            display: none;

            justify-content: center;

            align-items: center;

            padding: 20px;

            z-index: 9999;
        }


        #popupImage {

            display: block;

            max-width: 92%;

            max-height: 90%;

            width: auto;

            height: auto;

            object-fit: contain;

            border-radius: 12px;

            box-shadow:
                0 0 30px
                rgba(0, 0, 0, .5);
        }


        #closeBtn {

            position: absolute;

            top: 18px;

            right: 28px;

            color: #ffffff;

            font-size: 52px;

            font-weight: bold;

            line-height: 1;

            cursor: pointer;

            user-select: none;

            z-index: 10000;

            transition:
                color .3s ease;
        }


        #closeBtn:hover {

            color: #ff4d4d;
        }



        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 1024px) {


            .header-container {

                padding:
                    28px 30px;
            }


            .hospital-logo {

                width: 95px;

                height: 95px;

                min-width: 95px;
            }


            .hospital-name {

                font-size: 32px;
            }


            .hospital-location {

                font-size: 18px;
            }


            .back-section {

                padding:
                    18px 24px 0;
            }


            .photo-section {

                padding:
                    42px 24px 55px;
            }


            .photo-grid {

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 28px;
            }


            .photo-card img {

                height: 230px;
            }

        }



        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 768px) {


            /* -------------------------------------------------
               WHITE HEADER
            ------------------------------------------------- */

            .header-container {

                width: 100%;

                padding:
                    20px 16px 22px;

                display: flex;

                justify-content: flex-start;

                align-items: flex-start;

                gap: 14px;
            }


            /* -------------------------------------------------
               LOGO
            ------------------------------------------------- */

            .hospital-logo {

                width: 72px;

                height: 72px;

                min-width: 72px;

                border-width: 3px;

                font-size: 16px;
            }


            /* -------------------------------------------------
               HOSPITAL DETAILS
            ------------------------------------------------- */

            .hospital-details {

                flex: 1;

                min-width: 0;

                padding-top: 2px;
            }


            .hospital-name {

                font-size: 26px;

                line-height: 1.15;
            }


            .hospital-location {

                margin-top: 6px;

                font-size: 16px;

                line-height: 1.4;
            }



            /* -------------------------------------------------
               BACK SECTION
               
               This section is OUTSIDE the white header.
               Its background is the page background.
            ------------------------------------------------- */

            .back-section {

                width: 100%;

                max-width: none;

                padding:
                    16px 16px 0;

                margin: 0;

                background: #f8f9ff;
            }


            .back-button {

                font-size: 19px;

                gap: 4px;
            }


            .back-arrow {

                font-size: 27px;
            }



            /* -------------------------------------------------
               PHOTO SECTION
            ------------------------------------------------- */

            .photo-section {

                width: 100%;

                max-width: none;

                padding:
                    32px 16px 45px;
            }


            .photo-heading {

                font-size: 28px;

                margin-bottom: 24px;
            }



            /* -------------------------------------------------
               ONE COLUMN
            ------------------------------------------------- */

            .photo-grid {

                grid-template-columns: 1fr;

                gap: 30px;
            }


            .photo-card {

                width: 100%;
            }


            .photo-card img {

                width: 100%;

                height: 220px;

                border-radius: 12px;
            }


            .photo-title {

                margin-top: 12px;

                font-size: 18px;
            }



            /* -------------------------------------------------
               POPUP
            ------------------------------------------------- */

            #imagePopup {

                padding: 15px;
            }


            #popupImage {

                max-width: 96%;

                max-height: 82%;
            }


            #closeBtn {

                top: 12px;

                right: 16px;

                font-size: 42px;
            }

        }



        /* =====================================================
           SMALL PHONES
        ===================================================== */

        @media (max-width: 400px) {


            /* Header */

            .header-container {

                padding:
                    18px 12px 20px;

                gap: 11px;
            }


            .hospital-logo {

                width: 62px;

                height: 62px;

                min-width: 62px;

                font-size: 14px;
            }


            .hospital-name {

                font-size: 22px;
            }


            .hospital-location {

                font-size: 14px;

                margin-top: 5px;
            }



            /* Back */

            .back-section {

                padding:
                    14px 12px 0;
            }


            .back-button {

                font-size: 17px;
            }


            .back-arrow {

                font-size: 24px;
            }



            /* Photos */

            .photo-section {

                padding:
                    28px 12px 40px;
            }


            .photo-heading {

                font-size: 25px;

                margin-bottom: 20px;
            }


            .photo-grid {

                gap: 25px;
            }


            .photo-card img {

                height: 200px;
            }


            .photo-title {

                font-size: 16px;

                margin-top: 10px;
            }



            /* Popup */

            #closeBtn {

                top: 10px;

                right: 12px;

                font-size: 38px;
            }

        }

    </style>

</head>


<body>

<!-- =====================================================

<div id="imagePopup">


    <span

    <img
        id="popupImage"
        src=""
        alt="Enlarged Hospital Photo"
    >

<!-- =====================================================
                    JAVASCRIPT
===================================================== -->

<script>


/* =====================================================
   OPEN IMAGE
===================================================== */

function openImage(src) {

    const popup =
        document.getElementById("imagePopup");

    const image =
        document.getElementById("popupImage");


    image.src = src;

    popup.style.display = "flex";


    /* Prevent background scrolling */

    document.body.style.overflow = "hidden";

}



/* =====================================================
   CLOSE IMAGE
===================================================== */

function closeImage() {

    const popup =
        document.getElementById("imagePopup");


    popup.style.display = "none";


    /* Restore scrolling */

    document.body.style.overflow = "";

}



/* =====================================================
   CLOSE WHEN CLICKING OUTSIDE IMAGE
===================================================== */

document
    .getElementById("imagePopup")
    .addEventListener("click", function(event) {


        if (
            event.target.id === "imagePopup"
        ) {

            closeImage();

        }

    });



/* =====================================================
   CLOSE WITH ESCAPE
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "Escape"
        ) {

            closeImage();

        }

    }
);

</script>

</html>
