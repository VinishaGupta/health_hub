
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Hub - Page Slider</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            overflow:hidden;
            background:#f8f9ff;
            font-family:Arial,Helvetica,sans-serif;
        }

        .slider{
            display:flex;
            width:100%;
            height:100vh;
            transition:transform .5s ease;
        }

        .slider iframe{
            min-width:100%;
            height:100vh;
            border:none;
            background:white;
        }

        .arrow{
            position:fixed;
            top:50%;
            transform:translateY(-50%);
            width:60px;
            height:60px;
            border:none;
            border-radius:50%;
            background:rgba(255,255,255,.9);
            box-shadow:0 5px 20px rgba(0,0,0,.15);
            cursor:pointer;
            font-size:30px;
            font-weight:bold;
            z-index:999;
            transition:.3s;
        }

        .arrow:hover{
            background:#0B4DA2;
            color:white;
        }

        #prev{
            left:20px;
        }

        #next{
            right:20px;
        }

        .counter{
            position:fixed;
            bottom:25px;
            left:50%;
            transform:translateX(-50%);
            background:rgba(0,0,0,.6);
            color:white;
            padding:8px 18px;
            border-radius:25px;
            font-size:15px;
            z-index:999;
        }
    </style>

</head>

<body>

<div id="slider" class="slider">
    <iframe src="OPD-Booking.html"></iframe>

</div>

</body>

</html>
